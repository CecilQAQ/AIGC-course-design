<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIGHTLI F1 Team App</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f2f3f5;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:#0b0b0d}button,input,textarea,select{font-family:inherit}button{border:0;background:none;color:inherit;cursor:pointer}button:active{transform:scale(.98)}
    .phone{position:relative;width:375px;height:812px;background:#fff;border:10px solid #090909;border-radius:46px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.18)}.notch{position:absolute;z-index:20;left:50%;top:7px;width:112px;height:24px;transform:translateX(-50%);border-radius:99px;background:#090909}.status{position:absolute;z-index:19;left:0;right:0;top:0;height:36px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:800}.screen{position:absolute;inset:0;background:#fff;overflow:hidden}.page{height:100%;overflow-y:auto;background:#fff;padding-bottom:82px}.page.no-dock{padding-bottom:24px}.page::-webkit-scrollbar,.xscroll::-webkit-scrollbar{display:none}.page,.xscroll{scrollbar-width:none;-ms-overflow-style:none}.header{padding:44px 20px 0;display:flex;align-items:center;justify-content:space-between}.header h2{margin:0;font-size:17px;font-weight:900}.header.center{position:relative}.header.center h2{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-size:15px}.icon-btn{width:32px;height:32px;border-radius:99px;background:#f5f5f5;display:grid;place-items:center}.icon-btn.dark{background:#111;color:#fff}.bottom-nav{position:absolute;z-index:30;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #f1f1f1;padding:8px 18px 14px;display:grid;grid-template-columns:repeat(5,1fr)}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:10px;color:#999}.nav-item.active{color:#111;font-weight:900}.ui-icon{width:20px;height:20px;display:block;object-fit:contain}.ui-icon.small{width:17px;height:17px}.ui-icon.mid{width:22px;height:22px}.icon-fallback{font-size:18px;line-height:1;font-weight:900}.nav-item .ui-icon{width:19px;height:19px;opacity:.55}.nav-item.active .ui-icon{opacity:1}.icon-btn .ui-icon{width:17px;height:17px}
    .pic{position:relative;overflow:hidden;background:transparent}.pic img{width:100%;height:100%;object-fit:cover;display:block}.pic.dark:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.64),rgba(0,0,0,.08),transparent)}.muted{color:#7a7a82}.btn-dark{height:48px;border-radius:12px;background:#111;color:#fff;font-weight:900}.btn-light{height:44px;border-radius:12px;background:#f5f5f5;color:#222;font-weight:900}.tag{display:inline-flex;align-items:center;border-radius:99px;background:#f5f5f5;padding:8px 14px;font-size:12px;font-weight:900;color:#555}.tag.active{background:#111;color:#fff}.card{background:#fff;border-radius:24px;box-shadow:0 8px 28px rgba(0,0,0,.045)}.soft{background:#f8f8f9;border-radius:22px}.logo{display:block;max-width:100%;height:auto}.data-card{margin-top:12px;border-radius:24px;background:#111;color:#fff;padding:16px}.data-top{display:flex;justify-content:space-between;align-items:flex-start}.data-num{font-size:34px;margin:4px 0 0;font-weight:900;line-height:1}.rank-pill{height:30px;min-width:84px;border-radius:999px;background:#fff;color:#111;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;white-space:nowrap}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{border-radius:16px;background:rgba(255,255,255,.1);padding:10px 6px;text-align:center}.stat p{margin:0 0 6px;font-size:10px;color:rgba(255,255,255,.55)}.stat b{font-size:16px}.hero{position:relative;width:160px;height:208px;border-radius:28px;overflow:hidden;flex-shrink:0;text-align:left;background:transparent}.hero .pic{height:100%;border-radius:28px}.hero-text{position:absolute;left:0;right:0;bottom:0;color:#fff;padding:14px;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.05),transparent)}.hero-text span{font-size:10px}.hero-text h3{font-size:13px;line-height:1.4;margin:4px 0 0;font-weight:900}.drawer-wrap{position:absolute;inset:0;z-index:60;pointer-events:none}.drawer-wrap.open{pointer-events:auto}.drawer-mask{position:absolute;left:0;top:0;width:20%;height:100%;background:rgba(0,0,0,.25);opacity:0;transition:.25s}.drawer-wrap.open .drawer-mask{opacity:1}.drawer{position:absolute;right:0;top:0;width:80%;height:100%;background:#f5f5f5;padding:48px 16px 20px;box-shadow:-18px 0 45px rgba(0,0,0,.18);transform:translateX(100%);transition:.28s ease}.drawer-wrap.open .drawer{transform:translateX(0)}.drawer-card{background:#fff;border-radius:26px;padding:12px;margin-top:16px}.drawer-row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid #f5f5f5;font-size:17px;font-weight:900}.drawer-row:last-child{border-bottom:0}.toast{display:none;position:absolute;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);background:#111;color:#fff;padding:12px 26px;border-radius:99px;font-size:14px;font-weight:900}.toast.show{display:block}.pay-card{border-radius:22px;background:#111;color:#fff;padding:20px;box-shadow:0 10px 26px rgba(0,0,0,.18)}.comment{display:flex;gap:10px;margin-top:14px}.avatar-dot{width:32px;height:32px;border-radius:99px;background:#111;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900;flex-shrink:0}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #eee}.setting-row:last-child{border-bottom:0}
  </style>
</head>
<body>
  <div class="phone"><div class="notch"></div><div class="status"><span>9:41</span><span>5G ▰</span></div><div id="app" class="screen"></div><div id="toast" class="toast"></div></div>
<script>
const img={logoWhite:'assets/images/logo-white.png',logoDark:'assets/images/logo-dark.png',car:'assets/images/car.jpg',track:'assets/images/track.jpg',garage:'assets/images/garage.jpg',crowd:'assets/images/crowd.jpg',jacket:'assets/images/jacket.jpg',cap:'assets/images/cap.jpg',model:'assets/images/model.jpg',bottle:'assets/images/bottle.jpg',avatar:'assets/images/avatar.jpg',sale:'assets/images/sale.jpg'};
const iconPath={home:'assets/icons/home.png',race:'assets/icons/race.png',community:'assets/icons/community.png',shop:'assets/icons/shop.png',profile:'assets/icons/profile.png',cart:'assets/icons/cart.png',search:'assets/icons/search.png',bell:'assets/icons/bell.png'};
const fallback={home:'⌂',race:'◴',community:'✦',shop:'▣',profile:'◉',search:'⌕',bell:'●',cart:'🛒',back:'‹',menu:'☰',plus:'+',share:'↗',ok:'✓'};
const products=[{id:1,name:'NIGHTLI 车队夹克',price:2299,image:img.jacket,desc:'黑色 · L'},{id:2,name:'NIGHTLI 车队帽',price:299,image:img.cap,desc:'黑色 · 均码'},{id:3,name:'NIGHTLI 赛车模型',price:1299,image:img.model,desc:'1:18 收藏款'},{id:4,name:'NIGHTLI 随行水杯',price:159,image:img.bottle,desc:'黑色 · 500ml'}];
const races=[['R01','澳大利亚大奖赛','3月16日','已结束'],['R02','中国大奖赛','3月23日','已结束'],['R03','日本大奖赛','4月06日','已结束'],['R04','意大利大奖赛','6月01日','即将开始']];
const drivers=[['维斯塔','红牛车队',198],['诺里斯','迈凯伦车队',176],['NIGHTLI 一号车手','NIGHTLI',154],['勒克莱尔','法拉利车队',124],['汉密尔顿','法拉利车队',118]];
const teams=[['红牛车队','1胜 / 5领奖台',198],['迈凯伦车队','1胜 / 4领奖台',176],['NIGHTLI','2胜 / 7领奖台',154],['法拉利车队','0胜 / 3领奖台',124],['梅赛德斯车队','0胜 / 2领奖台',98]];
let state={page:'splash',cart:[],product:products[0],raceTab:'赛事日历',pay:'visa',liked:false,faved:false,profileTab:'作品',size:'S码',color:'黑色',comments:['NIGHTLI 这一站真的值得期待。','车队节奏比上一站稳很多。']};
const app=document.getElementById('app');
function uiIcon(name,cls=''){const src=iconPath[name];if(!src)return `<span class="icon-fallback ${cls}">${fallback[name]||name}</span>`;return `<img class="ui-icon ${cls}" src="${src}" onerror="this.outerHTML='<span class=\'icon-fallback ${cls}\'>${fallback[name]||''}</span>'">`}
function go(page,data){state.page=page;if(data)state.product=data;render()}
function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.className='toast show';setTimeout(()=>t.className='toast',1200)}
function pic(src,style='',dark=true){return `<div class="pic ${dark?'dark':''}" style="${style}"><img src="${src}" onerror="this.style.display='none'"></div>`}
function ibtn(name,click='',dark=false){return `<button class="icon-btn ${dark?'dark':''}" ${click?`onclick="${click}"`:''}>${uiIcon(name)}</button>`}
function header(title,left='',right='',center=false){return `<div class="header ${center?'center':''}"><div>${left}${center?'':`<h2>${title}</h2>`}</div>${center?`<h2>${title}</h2>`:''}<div style="display:flex;gap:8px">${right}</div></div>`}
function nav(){return `<div class="bottom-nav">${[['home','首页','home'],['race','赛事','race'],['community','社区','community'],['shop','商城','shop'],['profile','我的','profile']].map(([p,l,i])=>`<button onclick="go('${p}')" class="nav-item ${state.page===p?'active':''}">${uiIcon(i)}<span>${l}</span></button>`).join('')}</div>`}
function shell(html,dock=true){app.innerHTML=html+(dock?nav():'')}
function money(v){return '¥'+Number(v).toFixed(2)}
function total(){const goods=state.cart.reduce((s,i)=>s+i.price,0);const freight=0;const discount=state.cart.length?200:0;return{goods,freight,discount,total:Math.max(goods+freight-discount,0)}}
function addToCart(p){state.cart.push({...p,size:state.size||'S码',color:state.color||'黑色'});showToast('已加入购物车')}
function pageWrap(inner,dock=true,bg='#fff'){shell(`<div class="page ${dock?'':'no-dock'}" style="background:${bg}">${inner}</div>`,dock)}
function logo(src,width=88){return `<img class="logo" src="${src}" style="width:${width}px" onerror="this.outerHTML='<b style=\'letter-spacing:6px\'>NIGHTLI</b>'">`}
function splash(){shell(`<div style="height:100%;display:flex;flex-direction:column;justify-content:space-between;background:#eef2f8;padding:96px 28px 40px"><div style="margin:60px auto 0;width:128px;height:128px;border-radius:99px;background:#fff;display:grid;place-items:center;overflow:hidden">${logo(img.logoDark,92)}</div><div><button onclick="go('intro')" class="btn-dark" style="width:100%">开始</button><button onclick="go('home')" class="btn-light" style="width:100%;margin-top:12px;background:#fff">游客模式浏览</button></div></div>`,false)}
function intro(){pageWrap(`<div style="padding:48px 20px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${[img.car,img.garage,img.track,img.jacket].map(s=>pic(s,'height:144px;border-radius:24px')).join('')}</div><h1 style="margin:36px 8px 0;font-size:22px;line-height:1.35">Read the team story you want instantly</h1><p class="muted" style="margin:12px 8px;font-size:12px;line-height:1.7">快速查看车队资讯、赛事安排、车迷互动与官方周边。</p><button onclick="go('login')" class="btn-dark" style="margin-top:28px;width:100%">进入</button></div>`,false)}
function login(){pageWrap(`<div style="height:100%;background:#f5f5f5;padding:48px 20px"><div style="margin:0 auto 32px;width:112px;height:64px;background:#111;border-radius:2px;display:grid;place-items:center;overflow:hidden">${logo(img.logoWhite,88)}</div><div class="card" style="padding:28px"><h2>欢迎回来</h2><p class="muted" style="font-size:12px">登录 NIGHTLI 车队官方账号</p><input value="nightli.fan@email.com" style="width:100%;height:42px;border:0;border-bottom:1px solid #ddd;outline:0"><input type="password" value="123456" style="width:100%;height:42px;border:0;border-bottom:1px solid #ddd;outline:0;margin-top:16px"><button onclick="go('home')" class="btn-dark" style="width:100%;margin-top:28px">登录</button><button onclick="go('register')" style="margin-top:14px;width:100%;font-size:12px;color:#777">没有账号？立即注册</button></div></div>`,false)}
function register(){pageWrap(`${header('注册账号',ibtn('back',"go('login')"),'',true)}<div style="padding:28px 20px"><div class="card" style="padding:24px"><h2>创建 NIGHTLI 账号</h2><p class="muted" style="font-size:12px">注册后可同步订单、收藏和社区动态。</p>${input('昵称','Nightli Fan')}${input('邮箱','nightli.fan@email.com')}${input('手机号','138****2026')}${input('密码','123456','password')}<button onclick="showToast('注册成功');setTimeout(()=>go('home'),700)" class="btn-dark" style="width:100%;margin-top:24px">注册并进入</button></div></div>`,false)}
function input(label,value,type='text'){return `<label style="display:block;margin-top:16px;font-size:12px;color:#777">${label}</label><input type="${type}" value="${value}" style="width:100%;height:42px;border:0;border-bottom:1px solid #ddd;outline:0">`}
function home(){pageWrap(`${header('Hi, Jonathan!','',ibtn('search',"go('search')")+ibtn('bell'))}<div style="padding:0 20px"><p class="muted" style="margin:6px 0 0">NIGHTLI 车队官方数据</p><div class="data-card"><div class="data-top"><div><p style="font-size:10px;color:#aaa;margin:0">赛季总积分</p><h1 class="data-num">154</h1></div><span class="rank-pill">车队排名 P3</span></div><div class="stat-grid">${[['分站冠军',2],['领奖台',7],['年度冠军',0]].map(x=>`<div class="stat"><p>${x[0]}</p><b>${x[1]}</b></div>`).join('')}</div></div><div class="xscroll" style="margin-top:16px;display:flex;gap:16px;overflow:auto;padding-bottom:2px">${hero(img.car,'技术解析','NIGHTLI升级气动套件','article')}${hero(img.track,'赛事高光','下一站意大利大奖赛','story')}</div><h3 style="font-size:14px">最新资讯</h3><button onclick="go('article')" style="display:flex;width:100%;gap:12px;background:#fafafa;border-radius:22px;padding:12px;text-align:left">${pic(img.garage,'width:80px;height:80px;border-radius:18px;flex-shrink:0')}<div><b>车队研发中心公布空气动力学更新</b><p style="font-size:11px;color:#999">2小时前</p></div></button></div>`)}
function hero(src,tag,title,to){return `<button onclick="go('${to}')" class="hero">${pic(src,'height:100%;border-radius:28px')}<div class="hero-text"><span>${tag}</span><h3>${title}</h3></div></button>`}
function search(){const list=[['官方资讯','NIGHTLI升级气动套件','article',img.car],['赛事','意大利大奖赛赛程','raceDetail',img.track],['商城','队服夹克','productDetail',img.jacket],['社区','车迷排位赛讨论','postDetail',img.crowd]];pageWrap(`${header('搜索',ibtn('back',"go('home')"),'',true)}<div style="padding:20px"><div style="height:48px;border-radius:18px;background:#f5f5f5;display:flex;align-items:center;gap:10px;padding:0 16px">${uiIcon('search')}<input placeholder="搜索资讯、赛事、商品、社区" style="flex:1;border:0;background:transparent;outline:0"></div><h3>热门搜索</h3><div style="display:flex;flex-wrap:wrap;gap:8px">${['NIGHTLI 气动套件','意大利大奖赛','队服夹克','赛事积分榜'].map(t=>`<span class="tag">${t}</span>`).join('')}</div><h3>搜索结果</h3>${list.map(([a,b,to,im])=>`<button onclick="go('${to}',products[0])" style="display:flex;width:100%;gap:12px;background:#fafafa;border-radius:22px;padding:12px;text-align:left;margin-top:10px">${pic(im,'width:80px;height:80px;border-radius:18px;flex-shrink:0')}<div><p style="font-size:10px;color:#999;font-weight:800">${a}</p><b>${b}</b><p style="font-size:11px;color:#aaa">点击查看详情</p></div></button>`).join('')}</div>`)}
function race(){pageWrap(`${header('赛事','','')}<div style="padding:0 20px"><div class="xscroll" style="display:flex;gap:8px;overflow:auto;margin-top:16px">${['赛事日历','直播回放','积分榜','车队排名'].map(t=>`<button onclick="state.raceTab='${t}';race()" class="tag ${state.raceTab===t?'active':''}">${t}</button>`).join('')}</div>${raceContent()}</div>`)}
function raceContent(){if(state.raceTab==='直播回放')return replays();if(state.raceTab==='积分榜')return standings('driver');if(state.raceTab==='车队排名')return standings('team');return `${pic(img.track,'height:176px;border-radius:30px;margin-top:16px')}<button onclick="go('raceDetail')" style="width:100%;margin-top:20px;text-align:left;background:#111;color:#fff;border-radius:28px;padding:20px"><p style="font-size:10px;color:#aaa">下一站比赛</p><h2>意大利大奖赛</h2><p style="font-size:12px;color:#aaa">6月01日 21:00 · 蒙扎</p><div class="stat-grid">${['03 天','11 小时','18 分'].map(x=>`<div class="stat"><b>${x}</b></div>`).join('')}</div></button><div style="margin-top:16px">${races.map(r=>`<button onclick="go('raceDetail')" class="soft" style="width:100%;margin-top:10px;padding:14px;text-align:left"><b>${r[0]} ${r[1]}</b><p class="muted" style="margin:6px 0 0;font-size:12px">${r[2]} · ${r[3]}</p></button>`).join('')}</div>`}
function replays(){const arr=[['正赛完整回放','意大利大奖赛 · 53圈完整版','1:48:20',img.car],['排位赛高光','Q1-Q3关键圈速与冲线瞬间','12:36',img.track],['车手电台精选','NIGHTLI 关键策略通话合集','08:15',img.garage],['维修区幕后','赛车调校与换胎训练记录','06:40',img.crowd]];return `<div style="margin-top:16px">${arr.map(x=>`<button class="soft" style="display:flex;width:100%;gap:12px;padding:12px;text-align:left;margin-top:10px">${pic(x[3],'width:100px;height:74px;border-radius:16px;flex-shrink:0')}<div><b>${x[0]}</b><p class="muted" style="font-size:11px;line-height:1.5">${x[1]}</p><span style="background:#111;color:#fff;border-radius:99px;padding:4px 10px;font-size:10px">观看 ${x[2]}</span></div></button>`).join('')}</div>`}
function standings(type){const arr=type==='team'?teams:drivers;return `<div style="margin-top:16px">${arr.map((x,i)=>`<div class="soft" style="display:flex;align-items:center;justify-content:space-between;padding:14px;margin-top:10px;${x[0].includes('NIGHTLI')||x[1]==='NIGHTLI'?'background:#111;color:#fff':''}"><div><p style="margin:0;font-size:10px;color:${x[0].includes('NIGHTLI')||x[1]==='NIGHTLI'?'#aaa':'#999'}">#${i+1}</p><b>${x[0]}</b><p style="margin:6px 0 0;font-size:11px;color:${x[0].includes('NIGHTLI')||x[1]==='NIGHTLI'?'#aaa':'#999'}">${x[1]}</p></div><b>${x[2]} 分</b></div>`).join('')}</div>`}
function raceDetail(){pageWrap(`${header('赛道详情',ibtn('back',"go('race')"),'',true)}<div style="padding:20px">${pic(img.track,'height:220px;border-radius:28px')}<h2>意大利大奖赛 · 蒙扎</h2><p class="muted" style="line-height:1.7">蒙扎赛道以高速直道和重刹车区著称，对赛车低阻力套件、刹车稳定性和轮胎管理要求很高。</p><div class="soft" style="padding:16px"><b>赛道信息</b><p>长度：5.793 km</p><p>圈数：53 圈</p><p>比赛时间：6月01日 21:00</p></div><h3>参赛队伍</h3>${teams.slice(0,5).map((x,i)=>`<div class="soft" style="display:flex;justify-content:space-between;padding:14px;margin-top:10px"><b>${i+1}. ${x[0]}</b><span>${x[2]} 分</span></div>`).join('')}</div>`,false)}
function community(){pageWrap(`${header('社区','',ibtn('plus',"go('publish')",true))}<div style="padding:0 20px"><div style="display:flex;gap:8px;margin-top:16px">${['车队动态','赛道现场','新品上架'].map((t,i)=>`<button class="tag ${i===0?'active':''}">${t}</button>`).join('')}</div>${post(img.car,'BlueRacer_07')}${post(img.crowd,'SpeedHunter')}</div>`)}
function post(im,user){return `<button onclick="go('postDetail')" style="margin-top:16px;width:100%;background:#fafafa;border-radius:26px;padding:16px;text-align:left"><b>${user}</b><p style="font-size:12px;color:#555;line-height:1.7">排位赛太刺激了！车队的进步大家有目共睹。</p>${pic(im,'height:144px;border-radius:22px')}<div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#777"><span>♡ 128</span><span>评论 45</span><span>分享</span></div></button>`}

function prod(p){return `<div style="background:#fff;border-radius:16px;padding:8px;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.06);position:relative"><button onclick="go('productDetail',products.find(x=>x.id===${p.id}))" style="width:100%;text-align:left"><div style="position:relative">${pic(p.image,'height:132px;border-radius:14px',false)}<span style="position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:99px;background:#fff;color:#111;display:grid;place-items:center;font-size:16px">♡</span></div><p style="font-size:11px;color:#999;margin:9px 0 2px">官方周边</p><b style="font-size:13px;line-height:1.35;display:block;min-height:34px">${p.name}</b><div style="display:flex;align-items:end;justify-content:space-between;margin-top:6px"><b style="font-size:15px">${money(p.price)}</b><span style="font-size:9px;color:#999">★★★★★</span></div></button><button onclick="state.size='S码';state.color='黑色';addToCart(products.find(x=>x.id===${p.id}))" style="width:100%;height:30px;border-radius:8px;background:#111;color:#fff;font-size:11px;font-weight:800;margin-top:8px">加入购物车</button></div>`}

iv></div>`,false)}
